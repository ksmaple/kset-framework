<!doctype html>
<!-- kaka-requirements-designer:index -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设计文档</title>
<style>
:root { font-family: system-ui, "Microsoft YaHei", sans-serif; color: #202630; background: #fff; }
* { box-sizing: border-box; }
body { margin: 0; }
main { width: min(100% - 32px, 960px); margin: 0 auto; padding: 40px 0 64px; }
h1 { margin: 0 0 28px; font-size: 30px; }
h2 { margin: 28px 0 10px; font-size: 18px; }
ul { margin: 0; padding: 0; list-style: none; border-top: 1px solid #d9dfe4; }
li { border-bottom: 1px solid #d9dfe4; }
li a { display: flex; justify-content: space-between; gap: 16px; padding: 14px 4px; color: #205b8f; text-decoration: none; overflow-wrap: anywhere; }
li a:hover, li a:focus-visible { background: #eff6fb; text-decoration: underline; outline-offset: 2px; }
small { flex: 0 0 auto; color: #606b79; }
.empty { color: #606b79; }
@media (max-width: 640px) { main { padding-top: 24px; } li a { display: block; } small { display: block; margin-top: 4px; } }
</style>
</head>
<body>
<main>
  <h1>设计文档</h1>
  <!-- 仅为实际存在的页面添加 li；标题和 href 与文件保持一致。 -->
  <section aria-labelledby="logic-title">
    <h2 id="logic-title">现状说明</h2>
    <ul id="logic-pages"></ul>
  </section>
  <section aria-labelledby="requirements-title">
    <h2 id="requirements-title">需求设计</h2>
    <ul id="requirements-pages"></ul>
  </section>
</main>
</body>
</html>
