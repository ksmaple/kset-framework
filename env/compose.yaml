# Default local setup: all infrastructure processes in one container.
name: kset-local-one

services:
  infra:
    container_name: kset-local-infra
    build:
      context: .
      dockerfile: single/Dockerfile
    image: kset-local-infra:latest
    restart: unless-stopped
    mem_limit: 2048m
    ports:
      - "127.0.0.1:3306:3306"
      - "127.0.0.1:16379:6379"
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
      - "127.0.0.1:5432:5432"
      - "127.0.0.1:9876:9876"
      - "127.0.0.1:8081:8081"
    volumes:
      - mysql-data:/var/lib/mysql
      - redis-data:/data
      - nacos-data:/home/nacos/data
      - postgres-data:/var/lib/postgresql/data
      - rocketmq-store:/home/rocketmq/store
    networks:
      default:
        aliases:
          - mysql
          - redis
          - nacos
          - postgres
          - rocketmq-namesrv
          - rocketmq-broker
    healthcheck:
      test: ["CMD", "/usr/local/bin/kset-local-healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  postgres-data:
  rocketmq-store:
