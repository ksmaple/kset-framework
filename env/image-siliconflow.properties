# Host application argument (working directory: repository root):
# --spring.config.additional-location=optional:file:./env/image-siliconflow.properties
spring.config.import=optional:file:./env/.env[.properties]

kset.image.enabled=true
kset.image.base-url=https://api.siliconflow.cn/v1
kset.image.api-key=${SILICONFLOW_API_KEY:}

kset.image.vision.enabled=true
kset.image.vision.model=Qwen/Qwen3-VL-32B-Instruct
kset.image.vision.timeout=120s
kset.image.vision.max-tokens=2048

kset.image.generation.enabled=true
kset.image.generation.provider=siliconflow
kset.image.generation.model=Qwen/Qwen-Image
kset.image.generation.default-size=1328x1328
kset.image.generation.timeout=180s
# For reference-image editing, use Qwen/Qwen-Image-Edit-2509 instead.
# Reference-image requests must omit size; each request generates one image.
