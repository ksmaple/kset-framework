# Load from the host application with:
# --spring.config.additional-location=optional:file:./env/image-zhipu.properties
# Paths are relative to the application's working directory (repository root).
spring.config.import=optional:file:./env/.env[.properties]

kset.image.enabled=true
kset.image.base-url=https://open.bigmodel.cn/api/paas/v4
kset.image.api-key=${ZHIPU_API_KEY:}

kset.image.vision.enabled=true
kset.image.vision.model=glm-5.3-flash
kset.image.vision.timeout=180s
kset.image.vision.max-tokens=8192

# Text-to-image only; GLM-Image does not support this starter's /images/edits.
kset.image.generation.enabled=true
kset.image.generation.model=glm-image
kset.image.generation.default-size=1280x1280
kset.image.generation.timeout=180s
